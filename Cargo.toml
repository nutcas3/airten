[workspace]
resolver = "2"
members = [
    "crates/airten-core",
    "crates/airten-ffi",
    "crates/airten-python",
    "crates/airten-wasm",
    "crates/airten-cli",
    "crates/airten-bench",
    "crates/airten-test-utils",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.96.0"
authors = ["AirTen Team <team@airten.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ai-coustics/airten"
homepage = "https://airten.dev"
documentation = "https://docs.rs/airten"
keywords = ["audio", "dsp", "real-time", "neural-network", "voice"]
categories = ["multimedia::audio", "embedded", "wasm", "science"]

[workspace.dependencies]
# Internal crates
airten-core = { version = "1.0.0", path = "crates/airten-core" }
airten-bench = { version = "1.0.0", path = "crates/airten-bench" }
airten-test-utils = { version = "1.0.0", path = "crates/airten-test-utils" }

# Serialization
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.149", default-features = false }

# Error handling
thiserror = "2.0.17"
anyhow = "1.0.100"

# Async runtime
futures = "0.3.31"
async-std = { version = "1.13.2", features = ["attributes"] }

# Command line
clap = { version = "4.5.54", features = ["derive", "color"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# Testing
criterion = { version = "0.8.1", features = ["html_reports"] }
proptest = "1.9.0"
approx = "0.5.1"

# Python bindings
pyo3 = { version = "0.27.2", features = ["extension-module", "abi3-py38"] }
numpy = "0.27.1"

# WASM bindings
wasm-bindgen = "0.2.106"
js-sys = "0.3.83"
web-sys = "0.3.83"
console_error_panic_hook = "0.1.7"

# Audio I/O
hound = "3.5.1"
cpal = "0.17.1"

# Benchmarking
iai-callgrind = "0.16.1"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[profile.bench]
inherits = "release"
debug = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[profile.embedded]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
strip = true

[profile.test]
opt-level = 1
