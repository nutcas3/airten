[workspace]
resolver = "2"
members = [
    "crates/airten-core",
    "crates/airten-ffi",
    "crates/airten-python",
    "crates/airten-wasm",
    "crates/airten-cli",
    "crates/airten-bench",
    "crates/airten-test-utils",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["AirTen Team <team@airten.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ai-coustics/airten"
homepage = "https://airten.dev"
documentation = "https://docs.rs/airten"
keywords = ["audio", "dsp", "real-time", "neural-network", "voice"]
categories = ["multimedia::audio", "embedded", "wasm", "science"]

[workspace.dependencies]
# Internal crates
airten-core = { version = "1.0.0", path = "crates/airten-core" }
airten-bench = { version = "1.0.0", path = "crates/airten-bench" }
airten-test-utils = { version = "1.0.0", path = "crates/airten-test-utils" }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime (for CLI)
tokio = { version = "1.35", features = ["full"] }

# Command line
clap = { version = "4.4", features = ["derive", "color"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
approx = "0.5"

# Python bindings
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
numpy = "0.20"

# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"

# Audio I/O
hound = "3.5"
cpal = "0.15"

# Benchmarking
iai-callgrind = "0.11"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[profile.bench]
inherits = "release"
debug = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[profile.embedded]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
strip = true

[profile.test]
opt-level = 1
