name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      
      - name: Run benchmarks
        run: cargo bench --workspace -- --noplot
      
      - name: Run latency test
        run: |
          cargo build --package airten-cli --release
          ./target/release/airten benchmark --iterations 10000 --frame-size 512
      
      - name: Check latency target
        run: |
          OUTPUT=$(./target/release/airten benchmark --iterations 10000 --frame-size 512 2>&1)
          if echo "$OUTPUT" | grep -q "PASSED"; then
            echo "Latency target met!"
          else
            echo "Latency target NOT met!"
            exit 1
          fi

  benchmark-compare:
    name: Compare Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      
      - name: Benchmark base
        run: cargo bench --workspace -- --noplot --save-baseline base
      
      - uses: actions/checkout@v4
      
      - name: Benchmark PR
        run: cargo bench --workspace -- --noplot --baseline base
