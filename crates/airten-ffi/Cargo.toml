[package]
name = "airten-ffi"
version.workspace = true
edition = "2024"
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "C FFI bindings for AirTen audio processing library"
readme = "README.md"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = []

[dependencies]
airten-core = { workspace = true, features = ["std"] }

[build-dependencies]
cbindgen = "0.29.2"

[dev-dependencies]
