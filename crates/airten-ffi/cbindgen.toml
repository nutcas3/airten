[defines]

[export]
include = []
exclude = []
prefix = ""
item_types = ["constants", "globals", "enums", "structs", "unions", "typedefs", "opaque", "functions"]
renaming_overrides_prefixing = false

[export.rename]

[export.body]

[export.mangle]

[fn]
rename_args = "None"
args = "auto"
sort_by = "None"

[struct]
rename_fields = "None"
derive_constructor = false
derive_eq = false
derive_neq = false
derive_lt = false
derive_lte = false
derive_gt = false
derive_gte = false

[enum]
rename_variants = "None"
add_sentinel = false
prefix_with_name = false
derive_helper_methods = false
derive_const_casts = false
derive_mut_casts = false
cast_assert_name = "assert"
must_use = ""
derive_tagged_enum_destructor = false
derive_tagged_enum_copy_constructor = false
enum_class = true

[const]
allow_static_const = true
allow_constexpr = false
sort_by = "None"

[macro_expansion]
bitflags = false

[parse]
parse_deps = false
include = []
exclude = []
clean = false
extra_bindings = []

[parse.expand]
crates = []
all_features = false
default_features = true
features = []

[ptr]
non_null_attribute = ""

[layout]
packed = ""
aligned_n = ""

[documentation]
style = "auto"
length = "full"

language = "C"
cpp_compat = true
header = """
/*
 * AirTen Audio Processing Library
 * C/C++ Header File
 * 
 * Auto-generated by cbindgen - do not edit manually
 */

#ifndef AIRTEN_H
#define AIRTEN_H

#include <stdarg.h>
#include <stdbool.h>
#include <stddef.h>
#include <stdint.h>
#include <stdlib.h>

#ifdef __cplusplus
extern "C" {
#endif
"""
trailer = """
#ifdef __cplusplus
}
#endif

#endif /* AIRTEN_H */
"""
include_guard = ""
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = true
namespace = ""
namespaces = []
using_namespaces = []
sys_includes = []
includes = []
no_includes = false
after_includes = ""
braces = "SameLine"
line_length = 100
tab_width = 4
line_endings = "LF"
